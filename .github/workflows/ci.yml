name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MARIADB_MTR_CACHE_KEY: mariadb-mtr-ubuntu24-arm64-10.11.7-v2
  MARIADB_MTR_REVISION: 10.11.7-2ubuntu2

jobs:
  feature-parity:
    name: MariaDB feature parity
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      mariadb:
        image: mariadb:10.11.7
        env:
          MARIADB_ROOT_PASSWORD: my-sqweel
          MARIADB_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent -h 127.0.0.1 -pmy-sqweel"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CARGO_BUILD_JOBS: 1
      MARIADB_COMPARE_URL: mysql://root:my-sqweel@127.0.0.1:3306/test
      MARIADB_PARITY_REQUIRED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run pre-push checks against MariaDB
        run: tools/prepush.sh

  mtr-baseline:
    name: MariaDB MTR baseline
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:10.11.7
        env:
          MARIADB_ROOT_PASSWORD: my-sqweel
          MARIADB_DATABASE: test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent -h 127.0.0.1 -pmy-sqweel"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MARIADB_COMPARE_URL: mysql://root:my-sqweel@127.0.0.1:3307/test
    steps:
      - uses: actions/checkout@v4
      - name: Install MariaDB MTR runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            libnuma1 \
            libpcre2-8-0 \
            libpcre2-posix3 \
            libpmem1 \
            libssl3t64 \
            liburing2 \
            perl \
            zlib1g
      - name: Restore pinned MariaDB MTR packages
        id: mariadb-mtr-package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mariadb-mtr-packages
          key: ${{ env.MARIADB_MTR_CACHE_KEY }}
      - name: Prepare pinned MariaDB upstream MTR binaries and suite
        run: |
          set -euo pipefail
          MARIADB_MTR_CACHE_DIR="$RUNNER_TEMP/mariadb-mtr-packages" \
            tools/prepare_mariadb_mtr.sh \
            "$RUNNER_TEMP/mariadb-mtr" \
            --print-env > "$RUNNER_TEMP/mariadb-mtr.env"
          source "$RUNNER_TEMP/mariadb-mtr.env"
          test -f "$MARIADB_MTR_ROOT/mysql-test/main/1st.test"
          test -x "$MYSQLTEST_BIN"
          test -x "$MTR_SAFE_PROCESS"
      - name: Save pinned MariaDB MTR packages
        if: steps.mariadb-mtr-package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mariadb-mtr-packages
          key: ${{ steps.mariadb-mtr-package-cache.outputs.cache-primary-key }}
      - name: Validate unmodified upstream tests against MariaDB
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/mariadb-mtr.env"
          python3 tools/mariadb_mtr_compat.py \
            --target baseline \
            --suite-root "$MARIADB_MTR_ROOT" \
            --allowlist tests/mariadb-mtr-allowlist.txt \
            --baseline-url "$MARIADB_COMPARE_URL" \
            --mysqltest-bin "$MYSQLTEST_BIN" \
            --client-bindir "$MYSQL_CLIENT_BINDIR" \
            --mtr-runner "$MTR_RUNNER" \
            --safe-process-bin "$MTR_SAFE_PROCESS" \
            --mtr-layout mariadb \
            --baseline-label MariaDB \
            --report-dir artifacts/mariadb-mtr-baseline \
            --baseline-version 10.11.7 \
            --source-revision "$MARIADB_MTR_REVISION" \
            --minimum-percent 100
      - name: Upload MariaDB baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-mtr-baseline-report
          path: |
            artifacts/mariadb-mtr-baseline/mtr-report.json
            artifacts/mariadb-mtr-baseline/mtr-report.md
            artifacts/mariadb-mtr-baseline/**/stdout.log
            artifacts/mariadb-mtr-baseline/**/stderr.log
            artifacts/mariadb-mtr-baseline/**/log/**/*.log
            artifacts/mariadb-mtr-baseline/**/*.reject
            artifacts/mariadb-mtr-baseline/**/my.cnf
            artifacts/mariadb-mtr-baseline/**/mariadb-test-run.json
          if-no-files-found: warn

  mtr-mysqweel:
    name: MariaDB MTR compatibility
    needs: mtr-baseline
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install MariaDB MTR runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            libnuma1 \
            libpcre2-8-0 \
            libpcre2-posix3 \
            libpmem1 \
            libssl3t64 \
            liburing2 \
            perl \
            zlib1g
      - name: Restore pinned MariaDB MTR packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mariadb-mtr-packages
          key: ${{ env.MARIADB_MTR_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Prepare pinned MariaDB upstream MTR binaries and suite
        run: |
          set -euo pipefail
          MARIADB_MTR_CACHE_DIR="$RUNNER_TEMP/mariadb-mtr-packages" \
            tools/prepare_mariadb_mtr.sh \
            "$RUNNER_TEMP/mariadb-mtr" \
            --print-env > "$RUNNER_TEMP/mariadb-mtr.env"
          source "$RUNNER_TEMP/mariadb-mtr.env"
          test -f "$MARIADB_MTR_ROOT/mysql-test/main/1st.test"
          test -x "$MYSQLTEST_BIN"
          test -x "$MTR_SAFE_PROCESS"
      - name: Build MySqweel binary for MTR
        run: cargo build --locked --bin sqwl
      - name: Run unmodified upstream tests against MySqweel
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/mariadb-mtr.env"
          python3 tools/mariadb_mtr_compat.py \
            --target mysqweel \
            --suite-root "$MARIADB_MTR_ROOT" \
            --allowlist tests/mariadb-mtr-allowlist.txt \
            --mysqltest-bin "$MYSQLTEST_BIN" \
            --client-bindir "$MYSQL_CLIENT_BINDIR" \
            --mysqweel-bin target/debug/sqwl \
            --mtr-runner "$MTR_RUNNER" \
            --safe-process-bin "$MTR_SAFE_PROCESS" \
            --mtr-layout mariadb \
            --baseline-label MariaDB \
            --report-dir artifacts/mariadb-mtr-mysqweel \
            --baseline-version 10.11.7 \
            --source-revision "$MARIADB_MTR_REVISION" \
            --minimum-percent 100
      - name: Upload MySqweel MTR report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysqweel-mariadb-mtr-compatibility-report
          path: |
            artifacts/mariadb-mtr-mysqweel/mtr-report.json
            artifacts/mariadb-mtr-mysqweel/mtr-report.md
            artifacts/mariadb-mtr-mysqweel/**/stdout.log
            artifacts/mariadb-mtr-mysqweel/**/stderr.log
            artifacts/mariadb-mtr-mysqweel/**/log/**/*.log
            artifacts/mariadb-mtr-mysqweel/**/*.reject
            artifacts/mariadb-mtr-mysqweel/**/mysqweel.log
            artifacts/mariadb-mtr-mysqweel/**/my.cnf
            artifacts/mariadb-mtr-mysqweel/**/mariadb-test-run.json
          if-no-files-found: warn
