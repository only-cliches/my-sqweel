name: MariaDB MTR discovery

on:
  push:
    paths:
      - .github/workflows/mariadb-mtr-discovery.yml
      - Cargo.toml
      - Cargo.lock
      - tools/mariadb_mtr_compat.py
      - tools/mariadb_mtr_core.py
      - tools/mariadb_mtr_derived.py
      - tools/mariadb_mtr_discover.py
      - tools/mariadb_mtr_discover_core.py
      - tools/mariadb_mtr_plan.py
      - tools/mariadb_mtr_testing.py
      - tools/mariadb_mtr_scope.py
      - tests/test_mariadb_mtr_plan.py
      - tests/test_mariadb_mtr_scope.py
      - tests/test_mariadb_mtr_testing.py
      - tests/mariadb-mtr-scope-reviews.json
      - tools/prepare_mariadb_mtr.sh
      - tests/mariadb-mtr-allowlist.txt
      - tests/mariadb-mtr-derived.json
      - tests/mariadb-mtr-scope.txt
      - tests/query_coverage_mtr/**
      - tests/test_mysql_mtr_compat.py
      - tests/test_mariadb_mtr*.py
      - src/sql/**
      - src/storage/**
      - src/server/**
      - tests/transactions.rs
      - tests/wire_transactions.rs
  pull_request:
    paths:
      - .github/workflows/mariadb-mtr-discovery.yml
      - Cargo.toml
      - Cargo.lock
      - tools/mariadb_mtr_compat.py
      - tools/mariadb_mtr_core.py
      - tools/mariadb_mtr_derived.py
      - tools/mariadb_mtr_discover.py
      - tools/mariadb_mtr_discover_core.py
      - tools/mariadb_mtr_plan.py
      - tools/mariadb_mtr_testing.py
      - tools/mariadb_mtr_scope.py
      - tests/test_mariadb_mtr_plan.py
      - tests/test_mariadb_mtr_scope.py
      - tests/test_mariadb_mtr_testing.py
      - tests/mariadb-mtr-scope-reviews.json
      - tests/mariadb-mtr-allowlist.txt
      - tests/mariadb-mtr-derived.json
      - tests/mariadb-mtr-scope.txt
      - tests/query_coverage_mtr/**
      - tests/test_mariadb_mtr*.py
      - tests/test_mysql_mtr_compat.py
      - src/sql/**
      - src/storage/**
      - src/server/**
      - tests/transactions.rs
      - tests/wire_transactions.rs
  workflow_dispatch: {}
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

env:
  MARIADB_MTR_CACHE_KEY: mariadb-mtr-ubuntu24-arm64-10.11.7-v2
  MARIADB_MTR_REVISION: 10.11.7-2ubuntu2

jobs:
  audit:
    name: Account for every upstream MTR file
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    services:
      mariadb:
        image: mariadb:10.11.7
        env:
          MARIADB_ROOT_PASSWORD: my-sqweel
          MARIADB_DATABASE: test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent -h 127.0.0.1 -pmy-sqweel"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CARGO_BUILD_JOBS: 1
      MARIADB_COMPARE_URL: mysql://root:my-sqweel@127.0.0.1:3307/test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install MariaDB MTR runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            libnuma1 \
            libpcre2-8-0 \
            libpcre2-posix3 \
            libpmem1 \
            libssl3t64 \
            liburing2 \
            perl \
            zlib1g
      - name: Restore pinned MariaDB MTR packages
        id: mariadb-mtr-package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mariadb-mtr-packages
          key: ${{ env.MARIADB_MTR_CACHE_KEY }}
      - name: Prepare pinned MariaDB upstream MTR binaries and suite
        run: |
          set -euo pipefail
          MARIADB_MTR_CACHE_DIR="$RUNNER_TEMP/mariadb-mtr-packages" \
            tools/prepare_mariadb_mtr.sh \
            "$RUNNER_TEMP/mariadb-mtr" \
            --print-env > "$RUNNER_TEMP/mariadb-mtr.env"
          source "$RUNNER_TEMP/mariadb-mtr.env"
          test -f "$MARIADB_MTR_ROOT/mysql-test/main/1st.test"
          test -x "$MYSQLTEST_BIN"
          test -x "$MTR_SAFE_PROCESS"
      - name: Save pinned MariaDB MTR packages
        if: steps.mariadb-mtr-package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mariadb-mtr-packages
          key: ${{ steps.mariadb-mtr-package-cache.outputs.cache-primary-key }}
      - name: Inventory upstream MTR suite
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/mariadb-mtr.env"
          python3 tools/mariadb_mtr_discover.py \
            --suite-root "$MARIADB_MTR_ROOT" \
            --scope all \
            --output-dir artifacts/mariadb-mtr-discovery \
            --offset 0 \
            --limit 100000 \
            --max-statements 100000 \
            --include-safe-harness \
            --mtr-layout mariadb \
            --baseline-label MariaDB \
            --source-revision "$MARIADB_MTR_REVISION"
      - name: Verify exhaustive testing plan integrity
        run: |
          set -euo pipefail
          python3 tools/mariadb_mtr_plan.py \
            --inventory artifacts/mariadb-mtr-discovery/mariadb-mtr-discovery.json \
            --plan artifacts/mariadb-mtr-discovery/mariadb-mtr-testing-plan.json \
            --report-dir artifacts/mariadb-mtr-discovery/coverage-planning
      - name: Build MySqweel binary
        run: cargo build --locked --bin sqwl
      - name: Audit runnable complete-file candidates
        id: compatibility-audit
        continue-on-error: true
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/mariadb-mtr.env"
          python3 tools/mariadb_mtr_compat.py \
            --target both \
            --suite-root "$MARIADB_MTR_ROOT" \
            --allowlist artifacts/mariadb-mtr-discovery/mariadb-mtr-discovery-manifest.txt \
            --baseline-url "$MARIADB_COMPARE_URL" \
            --mysqltest-bin "$MYSQLTEST_BIN" \
            --client-bindir "$MYSQL_CLIENT_BINDIR" \
            --mysqweel-bin target/debug/sqwl \
            --mtr-runner "$MTR_RUNNER" \
            --safe-process-bin "$MTR_SAFE_PROCESS" \
            --mtr-layout mariadb \
            --baseline-label MariaDB \
            --report-dir artifacts/mariadb-mtr-discovery/audit \
            --baseline-version 10.11.7 \
            --source-revision "$MARIADB_MTR_REVISION" \
            --case-timeout 300 \
            --skip-mysqweel-after-baseline-failure \
            --minimum-percent 100
      - name: Audit focused contract scope
        id: focused-compatibility-audit
        continue-on-error: true
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/mariadb-mtr.env"
          python3 tools/mariadb_mtr_compat.py \
            --target both \
            --suite-root "$MARIADB_MTR_ROOT" \
            --allowlist tests/mariadb-mtr-scope.txt \
            --baseline-url "$MARIADB_COMPARE_URL" \
            --mysqltest-bin "$MYSQLTEST_BIN" \
            --client-bindir "$MYSQL_CLIENT_BINDIR" \
            --mysqweel-bin target/debug/sqwl \
            --mtr-runner "$MTR_RUNNER" \
            --safe-process-bin "$MTR_SAFE_PROCESS" \
            --mtr-layout mariadb \
            --baseline-label MariaDB \
            --report-dir artifacts/mariadb-mtr-discovery/focused-audit \
            --baseline-version 10.11.7 \
            --source-revision "$MARIADB_MTR_REVISION" \
            --case-timeout 300 \
            --skip-mysqweel-after-baseline-failure \
            --minimum-percent 100
      - name: Audit derived MTR scenarios
        id: derived-compatibility-audit
        continue-on-error: true
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/mariadb-mtr.env"
          python3 tools/mariadb_mtr_derived.py \
            --suite-root "$MARIADB_MTR_ROOT" \
            --manifest tests/mariadb-mtr-derived.json \
            --report-dir artifacts/mariadb-mtr-discovery/derived \
            --target both \
            --baseline-url "$MARIADB_COMPARE_URL" \
            --mysqltest-bin "$MYSQLTEST_BIN" \
            --client-bindir "$MYSQL_CLIENT_BINDIR" \
            --mysqweel-bin target/debug/sqwl \
            --mtr-runner "$MTR_RUNNER" \
            --safe-process-bin "$MTR_SAFE_PROCESS" \
            --baseline-label MariaDB \
            --baseline-version 10.11.7 \
            --source-revision "$MARIADB_MTR_REVISION" \
            --case-timeout 300 \
            --skip-mysqweel-after-baseline-failure \
            --minimum-percent 100
      - name: Generate final MariaDB MTR coverage report
        if: always()
        run: |
          set -euo pipefail
          python3 tools/mariadb_mtr_plan.py \
            --inventory artifacts/mariadb-mtr-discovery/mariadb-mtr-discovery.json \
            --plan artifacts/mariadb-mtr-discovery/mariadb-mtr-testing-plan.json \
            --report-dir artifacts/mariadb-mtr-discovery/coverage \
            --complete-report artifacts/mariadb-mtr-discovery/audit/mtr-report.json \
            --complete-report artifacts/mariadb-mtr-discovery/focused-audit/mtr-report.json \
            --derived-report artifacts/mariadb-mtr-discovery/derived/mtr-report.json
      - name: Require compatibility audit reports and infrastructure health
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import sys
          paths = [
              pathlib.Path("artifacts/mariadb-mtr-discovery/audit/mtr-report.json"),
              pathlib.Path("artifacts/mariadb-mtr-discovery/focused-audit/mtr-report.json"),
              pathlib.Path("artifacts/mariadb-mtr-discovery/derived/mtr-report.json"),
          ]
          failed = False
          for path in paths:
              if not path.is_file():
                  print(f"missing required compatibility report: {path}", file=sys.stderr)
                  failed = True
                  continue
              report = json.loads(path.read_text())
              counts = report.get("counts", {})
              if report.get("status") == "invalid" or counts.get("infrastructure", 0):
                  print(f"invalid baseline or infrastructure failure in compatibility report: {path}", file=sys.stderr)
                  failed = True
          raise SystemExit(1 if failed else 0)
          PY
      - name: Generate promotion candidates and job summary
        if: always()
        run: |
          set -euo pipefail
          discovery_dir="artifacts/mariadb-mtr-discovery"
          cat "$discovery_dir/mariadb-mtr-discovery.md" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$discovery_dir/coverage/mariadb-mtr-coverage.md" ]]; then
            cat "$discovery_dir/coverage/mariadb-mtr-coverage.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The final MariaDB MTR coverage report did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
          compatibility_report="$discovery_dir/audit/mtr-report.json"
          if [[ -f "$compatibility_report" ]]; then
            coverage_kind="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("coverage_kind", "complete-upstream"))' "$compatibility_report")"
            if [[ "$coverage_kind" == "complete-upstream" ]]; then
              python3 tools/mariadb_mtr_discover.py \
                --compat-report "$compatibility_report" \
                --promote-manifest "$discovery_dir/mariadb-mtr-promotion-candidates.txt"
            else
              echo "Complete-file promotion skipped for coverage kind: $coverage_kind" >> "$GITHUB_STEP_SUMMARY"
            fi
            cat "$discovery_dir/audit/mtr-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The compatibility audit did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
          focused_report="$discovery_dir/focused-audit/mtr-report.json"
          if [[ -f "$focused_report" ]]; then
            coverage_kind="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("coverage_kind", "complete-upstream"))' "$focused_report")"
            if [[ "$coverage_kind" == "complete-upstream" ]]; then
              python3 tools/mariadb_mtr_discover.py \
                --compat-report "$focused_report" \
                --promote-manifest "$discovery_dir/mariadb-mtr-focused-promotion-candidates.txt"
            else
              echo "Focused promotion skipped for coverage kind: $coverage_kind" >> "$GITHUB_STEP_SUMMARY"
            fi
            cat "$discovery_dir/focused-audit/mtr-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The focused contract audit did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
          derived_report="$discovery_dir/derived/mtr-report.json"
          if [[ -f "$derived_report" ]]; then
            cat "$discovery_dir/derived/mtr-report.md" >> "$GITHUB_STEP_SUMMARY"
            echo "Derived scenarios are audit-only; no complete-file promotion is generated." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The derived compatibility audit did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-mtr-discovery-${{ github.run_number }}
          path: |
            artifacts/mariadb-mtr-discovery/mariadb-mtr-discovery.json
            artifacts/mariadb-mtr-discovery/mariadb-mtr-testing-plan.json
            artifacts/mariadb-mtr-discovery/coverage-planning/mariadb-mtr-coverage.json
            artifacts/mariadb-mtr-discovery/coverage-planning/mariadb-mtr-coverage.md
            artifacts/mariadb-mtr-discovery/coverage/mariadb-mtr-coverage.json
            artifacts/mariadb-mtr-discovery/coverage/mariadb-mtr-coverage.md
            artifacts/mariadb-mtr-discovery/mariadb-mtr-discovery.md
            artifacts/mariadb-mtr-discovery/mariadb-mtr-discovery-manifest.txt
            artifacts/mariadb-mtr-discovery/mariadb-mtr-promotion-candidates.txt
            artifacts/mariadb-mtr-discovery/audit/mtr-report.json
            artifacts/mariadb-mtr-discovery/audit/mtr-report.md
            artifacts/mariadb-mtr-discovery/audit/**/stdout.log
            artifacts/mariadb-mtr-discovery/audit/**/stderr.log
            artifacts/mariadb-mtr-discovery/audit/**/log/**/*.log
            artifacts/mariadb-mtr-discovery/audit/**/*.reject
            artifacts/mariadb-mtr-discovery/audit/**/mysqweel.log
            artifacts/mariadb-mtr-discovery/audit/**/my.cnf
            artifacts/mariadb-mtr-discovery/audit/**/mariadb-test-run.json
            artifacts/mariadb-mtr-discovery/mariadb-mtr-focused-promotion-candidates.txt
            artifacts/mariadb-mtr-discovery/focused-audit/mtr-report.json
            artifacts/mariadb-mtr-discovery/focused-audit/mtr-report.md
            artifacts/mariadb-mtr-discovery/focused-audit/**/stdout.log
            artifacts/mariadb-mtr-discovery/focused-audit/**/stderr.log
            artifacts/mariadb-mtr-discovery/focused-audit/**/log/**/*.log
            artifacts/mariadb-mtr-discovery/focused-audit/**/*.reject
            artifacts/mariadb-mtr-discovery/derived/mtr-report.json
            artifacts/mariadb-mtr-discovery/derived/mtr-report.md
            artifacts/mariadb-mtr-discovery/derived/**/stdout.log
            artifacts/mariadb-mtr-discovery/derived/**/stderr.log
            artifacts/mariadb-mtr-discovery/derived/**/log/**/*.log
            artifacts/mariadb-mtr-discovery/derived/**/*.reject
            artifacts/mariadb-mtr-discovery/derived/**/mysqweel.log
            artifacts/mariadb-mtr-discovery/derived/**/my.cnf
            artifacts/mariadb-mtr-discovery/derived/**/mariadb-test-run.json
            artifacts/mariadb-mtr-discovery/focused-audit/**/mysqweel.log
            artifacts/mariadb-mtr-discovery/focused-audit/**/my.cnf
            artifacts/mariadb-mtr-discovery/focused-audit/**/mariadb-test-run.json
          if-no-files-found: warn
