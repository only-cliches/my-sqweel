name: MariaDB MTR discovery

on:
  push:
    paths:
      - .github/workflows/mariadb-mtr-discovery.yml
      - tools/mariadb_mtr_compat.py
      - tools/mariadb_mtr_discover.py
      - tools/mariadb_mtr_core.py
      - tools/mariadb_mtr_discover_core.py
      - tools/prepare_mariadb_mtr.sh
      - tests/mariadb-mtr-allowlist.txt
      - tests/mariadb-mtr-scope.txt
      - tests/test_mysql_mtr_compat.py
      - src/sql/engine/transaction.rs
      - src/storage/transaction_image.rs
      - src/server/mysql_wire.rs
      - tests/transactions.rs
      - tests/wire_transactions.rs
  workflow_dispatch: {}
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

env:
  MARIADB_MTR_CACHE_KEY: mariadb-mtr-ubuntu24-arm64-10.11.7-v2
  MARIADB_MTR_REVISION: 10.11.7-2ubuntu2

jobs:
  audit:
    name: Audit all in-scope upstream MTR candidates
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    services:
      mariadb:
        image: mariadb:10.11.7
        env:
          MARIADB_ROOT_PASSWORD: my-sqweel
          MARIADB_DATABASE: test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent -h 127.0.0.1 -pmy-sqweel"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CARGO_BUILD_JOBS: 1
      MARIADB_COMPARE_URL: mysql://root:my-sqweel@127.0.0.1:3307/test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install MariaDB MTR runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            libnuma1 \
            libpcre2-8-0 \
            libpcre2-posix3 \
            libpmem1 \
            libssl3t64 \
            liburing2 \
            perl \
            zlib1g
      - name: Restore pinned MariaDB MTR packages
        id: mariadb-mtr-package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mariadb-mtr-packages
          key: ${{ env.MARIADB_MTR_CACHE_KEY }}
      - name: Prepare pinned MariaDB upstream MTR binaries and suite
        run: |
          set -euo pipefail
          MARIADB_MTR_CACHE_DIR="$RUNNER_TEMP/mariadb-mtr-packages" \
            tools/prepare_mariadb_mtr.sh \
            "$RUNNER_TEMP/mariadb-mtr" \
            --print-env > "$RUNNER_TEMP/mariadb-mtr.env"
          source "$RUNNER_TEMP/mariadb-mtr.env"
          test -f "$MARIADB_MTR_ROOT/mysql-test/main/1st.test"
          test -x "$MYSQLTEST_BIN"
          test -x "$MTR_SAFE_PROCESS"
      - name: Save pinned MariaDB MTR packages
        if: steps.mariadb-mtr-package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mariadb-mtr-packages
          key: ${{ steps.mariadb-mtr-package-cache.outputs.cache-primary-key }}
      - name: Inventory upstream MTR suite
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/mariadb-mtr.env"
          python3 tools/mariadb_mtr_discover.py \
            --suite-root "$MARIADB_MTR_ROOT" \
            --output-dir artifacts/mariadb-mtr-discovery \
            --scope all \
            --offset 0 \
            --limit 100000 \
            --max-statements 100000 \
            --include-safe-harness \
            --mtr-layout mariadb \
            --baseline-label MariaDB \
            --source-revision "$MARIADB_MTR_REVISION"
      - name: Build MySqweel binary
        run: cargo build --locked --bin sqwl
      - name: Audit every in-scope file against MariaDB and MySqweel
        id: compatibility-audit
        continue-on-error: true
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/mariadb-mtr.env"
          python3 tools/mariadb_mtr_compat.py \
            --target both \
            --suite-root "$MARIADB_MTR_ROOT" \
            --allowlist artifacts/mariadb-mtr-discovery/mariadb-mtr-discovery-manifest.txt \
            --baseline-url "$MARIADB_COMPARE_URL" \
            --mysqltest-bin "$MYSQLTEST_BIN" \
            --client-bindir "$MYSQL_CLIENT_BINDIR" \
            --mysqweel-bin target/debug/sqwl \
            --mtr-runner "$MTR_RUNNER" \
            --safe-process-bin "$MTR_SAFE_PROCESS" \
            --mtr-layout mariadb \
            --baseline-label MariaDB \
            --report-dir artifacts/mariadb-mtr-discovery/audit \
            --baseline-version 10.11.7 \
            --source-revision "$MARIADB_MTR_REVISION" \
            --case-timeout 30 \
            --skip-mysqweel-after-baseline-failure \
            --minimum-percent 100
      - name: Audit focused contract scope
        id: focused-compatibility-audit
        continue-on-error: true
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/mariadb-mtr.env"
          python3 tools/mariadb_mtr_compat.py \
            --target both \
            --suite-root "$MARIADB_MTR_ROOT" \
            --allowlist tests/mariadb-mtr-scope.txt \
            --baseline-url "$MARIADB_COMPARE_URL" \
            --mysqltest-bin "$MYSQLTEST_BIN" \
            --client-bindir "$MYSQL_CLIENT_BINDIR" \
            --mysqweel-bin target/debug/sqwl \
            --mtr-runner "$MTR_RUNNER" \
            --safe-process-bin "$MTR_SAFE_PROCESS" \
            --mtr-layout mariadb \
            --baseline-label MariaDB \
            --report-dir artifacts/mariadb-mtr-discovery/focused-audit \
            --baseline-version 10.11.7 \
            --source-revision "$MARIADB_MTR_REVISION" \
            --case-timeout 60 \
            --skip-mysqweel-after-baseline-failure \
            --minimum-percent 100
      - name: Generate promotion candidates and job summary
        if: always()
        run: |
          set -euo pipefail
          discovery_dir="artifacts/mariadb-mtr-discovery"
          cat "$discovery_dir/mariadb-mtr-discovery.md" >> "$GITHUB_STEP_SUMMARY"
          compatibility_report="$discovery_dir/audit/mtr-report.json"
          if [[ -f "$compatibility_report" ]]; then
            python3 tools/mariadb_mtr_discover.py \
              --compat-report "$compatibility_report" \
              --promote-manifest "$discovery_dir/mariadb-mtr-promotion-candidates.txt"
            cat "$discovery_dir/audit/mtr-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The compatibility audit did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
          focused_report="$discovery_dir/focused-audit/mtr-report.json"
          if [[ -f "$focused_report" ]]; then
            python3 tools/mariadb_mtr_discover.py \
              --compat-report "$focused_report" \
              --promote-manifest "$discovery_dir/mariadb-mtr-focused-promotion-candidates.txt"
            cat "$discovery_dir/focused-audit/mtr-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The focused contract audit did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-mtr-discovery-${{ github.run_number }}
          path: |
            artifacts/mariadb-mtr-discovery/mariadb-mtr-discovery.json
            artifacts/mariadb-mtr-discovery/mariadb-mtr-discovery.md
            artifacts/mariadb-mtr-discovery/mariadb-mtr-discovery-manifest.txt
            artifacts/mariadb-mtr-discovery/mariadb-mtr-promotion-candidates.txt
            artifacts/mariadb-mtr-discovery/audit/mtr-report.json
            artifacts/mariadb-mtr-discovery/audit/mtr-report.md
            artifacts/mariadb-mtr-discovery/audit/**/stdout.log
            artifacts/mariadb-mtr-discovery/audit/**/stderr.log
            artifacts/mariadb-mtr-discovery/audit/**/log/**/*.log
            artifacts/mariadb-mtr-discovery/audit/**/*.reject
            artifacts/mariadb-mtr-discovery/audit/**/mysqweel.log
            artifacts/mariadb-mtr-discovery/audit/**/my.cnf
            artifacts/mariadb-mtr-discovery/audit/**/mariadb-test-run.json
            artifacts/mariadb-mtr-discovery/mariadb-mtr-focused-promotion-candidates.txt
            artifacts/mariadb-mtr-discovery/focused-audit/mtr-report.json
            artifacts/mariadb-mtr-discovery/focused-audit/mtr-report.md
            artifacts/mariadb-mtr-discovery/focused-audit/**/stdout.log
            artifacts/mariadb-mtr-discovery/focused-audit/**/stderr.log
            artifacts/mariadb-mtr-discovery/focused-audit/**/log/**/*.log
            artifacts/mariadb-mtr-discovery/focused-audit/**/*.reject
            artifacts/mariadb-mtr-discovery/focused-audit/**/mysqweel.log
            artifacts/mariadb-mtr-discovery/focused-audit/**/my.cnf
            artifacts/mariadb-mtr-discovery/focused-audit/**/mariadb-test-run.json
          if-no-files-found: warn
