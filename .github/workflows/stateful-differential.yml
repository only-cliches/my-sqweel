name: Extended stateful MariaDB differential testing

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stateful-differential:
    name: 512 generated stateful programs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11.7
        env:
          MARIADB_ROOT_PASSWORD: my-sqweel
          MARIADB_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent -h 127.0.0.1 -pmy-sqweel"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CARGO_BUILD_JOBS: 1
      MARIADB_COMPARE_URL: mysql://root:my-sqweel@127.0.0.1:3306/test
      MARIADB_PARITY_REQUIRED: 1
      STATEFUL_DIFFERENTIAL_SEEDS: 512
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run generated stateful programs against MariaDB
        run: >-
          cargo test --locked --test stateful_differential
          generated_stateful_programs_match_mariadb -- --exact --nocapture
